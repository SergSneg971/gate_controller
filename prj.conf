# Внутренний RC-генератор + калибровка для MPSL/Zigbee
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

# Сборка UF2 для загрузчика Adafruit
CONFIG_BUILD_OUTPUT_UF2=y

# Обязательные базовые флаги стека Zigbee из примеров NCS v2.7!
CONFIG_ZIGBEE=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_ROUTER=y
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y
CONFIG_ZIGBEE_CHANNEL_MASK=0x07FFF800
CONFIG_IEEE802154_NRF5=y

# Отключаем конфликтующий IPv6 / Network stack, который тянется за 802.15.4
CONFIG_NET_L2_IEEE802154=n
CONFIG_NETWORKING=n

# Криптография для ZBOSS
CONFIG_CRYPTO=y
CONFIG_CRYPTO_NRF_ECB=y
CONFIG_ENTROPY_GENERATOR=y

# Хранилище NVRAM для ZBOSS
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Память и стеки (как в примерах Zigbee NCS v2.7)
CONFIG_GPIO=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048

# Отключаем USB и консоли
CONFIG_USB_DEVICE_STACK=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
