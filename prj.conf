# Обязательный базовый профиль nRF Connect SDK
CONFIG_NCS_SAMPLES_DEFAULTS=y

# Внутренний RC-генератор (на SuperMini нет внешнего кварца 32.768 кГц)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Сборка UF2 для загрузчика Adafruit
CONFIG_BUILD_OUTPUT_UF2=y

# Криптография для ZBOSS с правильным приоритетом инициализации из light_bulb!
CONFIG_CRYPTO=y
CONFIG_CRYPTO_NRF_ECB=y
CONFIG_CRYPTO_INIT_PRIORITY=80
CONFIG_ENTROPY_GENERATOR=y

# Стек Zigbee (Роль Роутера + таймер через k_timer ядра)
CONFIG_ZIGBEE=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_ROUTER=y
CONFIG_ZIGBEE_TIME_KTIMER=y
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y
CONFIG_ZIGBEE_CHANNEL_MASK=0x07FFF800

# Сетевой стек (как в примерах Nordic)
CONFIG_NET_IPV6=n
CONFIG_NET_IP_ADDR_CHECK=n
CONFIG_NET_UDP=n

# Хранилище NVRAM для ZBOSS
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Периферия и память
CONFIG_GPIO=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Отключаем USB и консоли
CONFIG_USB_DEVICE_STACK=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
