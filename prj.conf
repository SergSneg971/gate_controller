# Тактирование для SuperMini (внутренний RC-генератор без кварца 32.768 кГц)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

# Генерация UF2 для загрузчика Adafruit
CONFIG_BUILD_OUTPUT_UF2=y

# Стек Zigbee (Роль Роутера — постоянное питание от блока ворот)
CONFIG_ZIGBEE=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_ROUTER=y
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y

# Криптография для ZBOSS
CONFIG_CRYPTO=y
CONFIG_CRYPTO_NRF_ECB=y
CONFIG_ENTROPY_GENERATOR=y

# Периферия и память
CONFIG_GPIO=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048

# Отключаем USB и консоли
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# Привязка к разделам settings_storage и zboss_nvram из pm_static.yml
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
